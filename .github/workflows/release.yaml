on:
    push:
        branches:
            - master

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

name: release
jobs:
    release_please:
        permissions:
            contents: write
            pull-requests: write
            id-token: write

        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.release.outputs.version }}
            major: ${{ steps.release.outputs.major }}
            minor: ${{ steps.release.outputs.minor }}
            patch: ${{ steps.release.outputs.patch }}
            release_created: ${{ steps.release.outputs.release_created }}
        steps:
            - uses: googleapis/release-please-action@v4
              id: release

    publish_npm:
        needs: release_please
        if: ${{ needs.release_please.outputs.release_created }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  registry-url: 'https://registry.npmjs.org'
            - run: npm ci
            - run: npm publish --provenance --access public
            - name: Wait for npm package availability
              timeout-minutes: 10
              shell: bash
              run: |
                  package_spec=$(node -p "const pkg = require('./package.json'); pkg.name + '@' + pkg.version")

                  for attempt in {1..30}; do
                      echo "Checking npm availability for $package_spec (attempt $attempt/30)"
                      if npm pack "$package_spec" --dry-run --ignore-scripts --loglevel=error \
                          --registry=https://registry.npmjs.org --prefer-online \
                          --fetch-retries=0 --fetch-timeout=10000 > /dev/null; then
                          echo "$package_spec is available on npm"
                          exit 0
                      fi

                      if [ "$attempt" -lt 30 ]; then
                          sleep 10
                      fi
                  done

                  echo "::error::$package_spec did not become available on npm after 30 attempts"
                  exit 1

    publish_docker:
        name: Create and publish a Docker image
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write
            attestations: write
            id-token: write

        needs: [release_please, publish_npm]
        if: ${{needs.release_please.outputs.release_created}}

        steps:
            - run: echo version v${{ needs.release_please.outputs.version }}

            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3
              with:
                  platforms: 'arm64'

            - name: Set up Docker Buildx
              id: buildx
              uses: docker/setup-buildx-action@v3
              with:
                  platforms: linux/arm64,linux/amd64

            - name: Log in to the Container registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata (tags, labels) for Docker
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  flavor: |
                      latest=auto
                  tags: |
                      type=semver,pattern={{version}},value=v${{needs.release_please.outputs.major}}.${{needs.release_please.outputs.minor}}.${{needs.release_please.outputs.patch}}
                      type=semver,pattern={{major}}.{{minor}},value=v${{needs.release_please.outputs.major}}.${{needs.release_please.outputs.minor}}.${{needs.release_please.outputs.patch}}
                      type=semver,pattern={{major}},value=v${{needs.release_please.outputs.major}}.${{needs.release_please.outputs.minor}}.${{needs.release_please.outputs.patch}}

            - name: Build and push Docker image
              id: push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  build-args: |
                      PLUGIN_VERSION=${{ needs.release_please.outputs.version }}
                  platforms: ${{ steps.buildx.outputs.platforms }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
